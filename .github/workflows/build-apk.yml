# Gera o APK automaticamente a cada alteração no repositório
# e publica em "Releases" com um link fixo para instalar nas TVs.
# Ajustado: o projeto está dentro da subpasta "skyfit-chamada-tv".
name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyfit-chamada-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk skyfit-chamada.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chamada TV v1.0.${{ github.run_number }}
          files: skyfit-chamada-tv/skyfit-chamada.apk
          make_latest: true
